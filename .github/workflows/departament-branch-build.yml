name: departament desktop (branch build)

# Builds a ready-to-run, self-contained Windows x64 build of the departament VPN
# desktop app and bundles the Xray core + geo assets, then uploads it as a
# downloadable artifact. Trigger: push to the dev branch, or run manually.
#
# Ядра ЗАКРЕПЛЕНЫ версией и контрольной суммой. Раньше сборка брала «latest» в момент
# запуска, и выход нового ядра наверху мог за ночь сломать подключение без единой правки
# здесь. Обновление ядра — это правка версии и суммы ниже и проверка сгенерированных
# конфигов этим ядром (sing-box check / xray run -test), а не случайность расписания.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/dp-desktop-incy

permissions:
  contents: read

env:
  XRAY_TAG: v26.3.27
  XRAY_SHA256: d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad
  SINGBOX_VERSION: 1.14.1
  SINGBOX_SHA256: 5197f16d492d93202dc623622149a6ed040f8eca263128f91d603f2b901baa89

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained win-x64)
        working-directory: ./v2rayN
        run: dotnet publish ./v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o "${{ github.workspace }}/dist"

      - name: Strip debug symbols
        shell: pwsh
        run: Get-ChildItem "${{ github.workspace }}/dist" -Filter *.pdb -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Verify departament executable
        shell: pwsh
        run: |
          # The project's AssemblyName is now "departament", so publish emits
          # departament.exe natively (correct filename AND baked FileDescription).
          # No rename needed; just fail fast if the expected host is missing.
          $exe = Join-Path "${{ github.workspace }}/dist" 'departament.exe'
          if (Test-Path $exe) {
            Write-Host 'Found departament.exe (native, no rename needed)'
          } else {
            # Fallback: a stale v2rayN.exe would mean AssemblyName regressed.
            $legacy = Join-Path "${{ github.workspace }}/dist" 'v2rayN.exe'
            if (Test-Path $legacy) {
              Rename-Item $legacy 'departament.exe' -Force
              Write-Host 'AssemblyName regressed; renamed v2rayN.exe -> departament.exe'
            } else {
              throw 'departament.exe not found in publish output'
            }
          }

      - name: Bundle Xray core + geo assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_TAG/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          $hash = (Get-FileHash xray.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:XRAY_SHA256) { throw "Xray-windows-64.zip ($env:XRAY_TAG): SHA256 $hash, expected $env:XRAY_SHA256" }
          Expand-Archive xray.zip -DestinationPath xray -Force
          $dir = "${{ github.workspace }}/dist/bin/Xray"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item xray/xray.exe "$dir/xray.exe" -Force
          # wintun.dll — рядом с xray.exe: собственный TUN-вход Xray (режим «весь трафик» для
          # обычных, не Custom, узлов) грузит его из своей папки, а сам его не содержит. Без
          # файла Xray не может создать адаптер, и туннель не поднимается.
          if (-not (Test-Path xray/wintun.dll)) { throw 'wintun.dll not found in the Xray archive' }
          Copy-Item xray/wintun.dll "$dir/wintun.dll" -Force
          Copy-Item xray/geoip.dat "${{ github.workspace }}/dist/bin/geoip.dat" -Force
          Copy-Item xray/geosite.dat "${{ github.workspace }}/dist/bin/geosite.dat" -Force
          $ver = (& "$dir/xray.exe" version | Select-Object -First 1)
          if ($ver -notmatch "^Xray $([regex]::Escape($env:XRAY_TAG.TrimStart('v'))) ") { throw "unexpected Xray version: $ver" }
          Write-Host "Bundled $ver"

      - name: Bundle sing-box core (TUN pre-service, embeds wintun)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile singbox.zip
          $hash = (Get-FileHash singbox.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:SINGBOX_SHA256) { throw "sing-box $env:SINGBOX_VERSION windows-amd64: SHA256 $hash, expected $env:SINGBOX_SHA256" }
          Expand-Archive singbox.zip -DestinationPath singbox -Force
          $exe = Get-ChildItem singbox -Recurse -Filter 'sing-box.exe' | Select-Object -First 1
          if (-not $exe) { throw 'sing-box.exe not found in the downloaded archive' }
          $dir = "${{ github.workspace }}/dist/bin/sing_box"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $exe.FullName "$dir/sing-box.exe" -Force
          $ver = (& "$dir/sing-box.exe" version | Select-Object -First 1)
          if ($ver -ne "sing-box version $env:SINGBOX_VERSION") { throw "unexpected sing-box version: $ver" }
          Write-Host "Bundled $ver"

      - name: Bundle sing-box rule-sets (bin/srss)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Наборы правил — ФАЙЛАМИ рядом с приложением. Без них конфиг sing-box ссылается на
          # удалённые наборы, и ядро при старте качает их через туннель; не скачалось —
          # FATAL «initial rule-set», и подключение уходит в круг перезапусков. Локальный файл
          # приложение берёт первым (SingboxRulesetService), и старт от сети не зависит.
          # Список — все теги встроенных маршрутов (белый, чёрный, глобальный), DNS-шаблонов и
          # умолчаний «Обновить базы» (UpdateService); тот же набор кладут пакеты апстрима.
          $sets = @{
            'geoip'   = @('private', 'cn', 'facebook', 'fastly', 'google', 'netflix', 'telegram', 'twitter')
            'geosite' = @('private', 'cn', 'google', 'gfw', 'greatfire', 'geolocation-cn', 'category-ads-all')
          }
          $dir = "${{ github.workspace }}/dist/bin/srss"
          New-Item -ItemType Directory -Force -Path $dir, srs-check | Out-Null
          $sb = "${{ github.workspace }}/dist/bin/sing_box/sing-box.exe"
          foreach ($kind in $sets.Keys) {
            foreach ($name in $sets[$kind]) {
              $tag = "$kind-$name"
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/2dust/sing-box-rules/rule-set-$kind/$tag.srs" -OutFile "$dir/$tag.srs"
              # Данные наборов обновляются ежедневно, а ядро закреплено: проверяем, что именно
              # это ядро файл читает. Иначе новый формат наверху сломал бы старт уже у людей.
              & $sb rule-set decompile -o "srs-check/$tag.json" "$dir/$tag.srs"
              if ($LASTEXITCODE -ne 0) { throw "sing-box $env:SINGBOX_VERSION cannot read $tag.srs" }
            }
          }
          Write-Host 'Bundled rule-sets:' ((Get-ChildItem $dir -Filter *.srs).Name -join ', ')

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: departament-vpn-win-x64
          path: dist
          if-no-files-found: error
